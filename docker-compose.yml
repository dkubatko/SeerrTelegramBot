services:
  seerr-telegram-bot:
    build: .
    image: seerr-telegram-bot:latest
    container_name: seerr-telegram-bot
    restart: unless-stopped
    ports:
      - "8420:8420"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      SEERR_URL: ${SEERR_URL}
      SEERR_API_KEY: ${SEERR_API_KEY}
      ADMIN_CHAT_ID: ${ADMIN_CHAT_ID:-}
      SEERR_PUBLIC_URL: ${SEERR_PUBLIC_URL:-}
      WEBHOOK_AUTH_TOKEN: ${WEBHOOK_AUTH_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FORWARD_OTHER_NOTIFICATIONS: ${FORWARD_OTHER_NOTIFICATIONS:-false}
      NOTIFY_ON_START: ${NOTIFY_ON_START:-false}
