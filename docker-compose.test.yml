# Local test stack. Runs the real bot container against a fake Seerr, so
# nothing touches your live instance.
#
#   ./scripts/test-cards.sh                        real Telegram, fake Seerr
#   docker compose -f docker-compose.test.yml up -d   fake both, no credentials
#
# The second form needs no credentials at all. The first sends real cards to
# your phone, and is what test-cards.sh sets up.

services:
  bot:
    build: .
    image: seerr-telegram-bot:latest
    container_name: seerr-bot-test
    restart: unless-stopped
    ports:
      # 8421 on the host, so this stack can run beside a real deployment
      # that already holds 8420.
      - "8421:8420"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-demo-token}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE-http://mock-telegram:9111}
      SEERR_URL: http://mock-seerr:5055
      # The container name above is unusable on a Telegram button, so give the
      # link something your phone could actually open.
      SEERR_PUBLIC_URL: ${SEERR_PUBLIC_URL:-http://127.0.0.1:5055}
      SEERR_API_KEY: test-api-key
      ADMIN_CHAT_ID: ${ADMIN_CHAT_ID:-4242}
      GROUP_CHAT_ID: ${GROUP_CHAT_ID:-}
      LOG_LEVEL: DEBUG
    # Only Seerr is a startup dependency; the bot retries Telegram on its own,
    # so the mock can be left out entirely when using the real API.
    depends_on:
      - mock-seerr

  mock-seerr:
    image: seerr-telegram-bot:latest
    container_name: seerr-bot-test-mock-seerr
    restart: unless-stopped
    ports:
      - "5055:5055"
    healthcheck:
      disable: true
    volumes:
      - ./scripts:/app/scripts:ro
    command: >
      python scripts/mock_seerr.py
      --port 5055
      --bot-url http://bot:8420/webhook

  mock-telegram:
    image: seerr-telegram-bot:latest
    container_name: seerr-bot-test-mock-telegram
    restart: unless-stopped
    ports:
      - "9111:9111"
    healthcheck:
      disable: true
    volumes:
      - ./scripts:/app/scripts:ro
    command: python scripts/mock_telegram.py --port 9111
